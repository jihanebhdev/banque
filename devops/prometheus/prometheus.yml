global:
  scrape_interval: 15s       # How often to scrape targets
  evaluation_interval: 15s   # How often to evaluate rules
  external_labels:
    monitor: 'banquesys-monitor'
    environment: 'development'

# Alertmanager configuration (optional for now)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Alerting rules (load from files)
rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:

  # ── Spring Boot Backend (Actuator /prometheus endpoint) ──────────────────
  - job_name: 'banquesys-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: 'backend'
          app: 'banquesys'

  # ── Prometheus itself ─────────────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Node Exporter (host OS metrics: CPU, RAM, disk, network) ─────────────
  - job_name: 'node-exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'

  # ── cAdvisor (per-container resource metrics) ─────────────────────────────
  - job_name: 'cadvisor'
    scrape_interval: 15s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'

  # ── PostgreSQL Exporter (optional - requires postgres_exporter) ───────────
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
