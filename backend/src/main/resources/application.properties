# =========================================================================
# BANQUESYS SERVICE CONFIGURATION (MOCK vs SANDBOX)
# =========================================================================
# Enable Sandbox integrations (stripe, veriff, real, openai, api, ai)
# or fallback to local simulations (mock, mock, mock, mock, constant, rule)
# =========================================================================

# 1. Funding Service (Stripe Sandbox)
# Options: 'stripe' (Stripe API) | 'mock' (local simulation)
banquesys.service.funding=stripe
STRIPE_API_KEY=YOUR_STRIPE_KEY

# 2. KYC & Document OCR (OpenAI Vision/Veriff Simulation)
# Options: 'veriff' (OpenAI Vision OCR extraction) | 'mock' (local auto-approval)
banquesys.service.kyc=veriff

# 3. Notification Service (Mailtrap/SMTP & Twilio)
# Options: 'real' (sends real email/SMS) | 'mock' (logs only)
banquesys.service.notification=real
TWILIO_ACCOUNT_SID=
TWILIO_AUTH_TOKEN=

# 4. Chatbot IA Service
# Options: 'openai' (uses OpenAI GPT-4o-mini + RAG) | 'mock' (regex FAQ)
banquesys.service.chatbot=openai

# 5. Exchange Rate FX Service
# Options: 'api' (fetches live open.er-api.com rates) | 'constant' (hardcoded)
banquesys.service.exchangerate=api

# 6. AI Expense Categorizer
# Options: 'ai' (GPT-4o-mini categorizing) | 'rule' (regex keyword based)
banquesys.service.categorizer=ai

# 7. Electronic Signature
# Options: 'mock' (local signature pad)
banquesys.service.signature=mock

# =========================================================================
# ACTUATOR & PROMETHEUS METRICS (DevOps Observability)
# =========================================================================

# Expose all actuator endpoints over HTTP
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers,env,beans,threaddump,heapdump
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# Enable Prometheus metrics endpoint
management.endpoint.prometheus.enabled=true

# Application info for Grafana dashboards
management.info.env.enabled=true
info.app.name=BanqueSys Backend
info.app.version=1.0.0
info.app.description=Banque System - Spring Boot REST API

# Metrics configuration
management.metrics.tags.application=banquesys
management.metrics.tags.environment=development
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms,1s

